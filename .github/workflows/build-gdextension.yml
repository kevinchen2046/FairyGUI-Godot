name: Build GDExtension

on:
  push:
    branches: [gdextension]
  pull_request:
    branches: [gdextension]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons

      - name: Build editor library
        run: >-
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }}
          target=editor dev_build=no debug_symbols=no -j2

      - name: Build release library
        run: >-
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }}
          target=template_release dev_build=no debug_symbols=no -j2

      - name: Upload plugin libraries
        uses: actions/upload-artifact@v4
        with:
          name: fairygui-${{ matrix.platform }}-${{ matrix.arch }}
          path: examples/addons/fairygui/
          if-no-files-found: error
