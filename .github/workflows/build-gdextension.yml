name: Build GDExtension

permissions:
  contents: write

on:
  push:
    branches: [gdextension]
    tags: ["v*"]
  pull_request:
    branches: [gdextension]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.4.0

      - name: Build editor library
        run: >-
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }}
          target=editor dev_build=no debug_symbols=no -j2

      - name: Build release library
        run: >-
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }}
          target=template_release dev_build=no debug_symbols=no -j2

      - name: Upload desktop libraries
        uses: actions/upload-artifact@v4
        with:
          name: fairygui-${{ matrix.platform }}-${{ matrix.arch }}
          path: examples/addons/fairygui/bin/
          if-no-files-found: error

  android:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.4.0

      - name: Build Android debug library
        run: >-
          scons platform=android arch=${{ matrix.arch }} target=template_debug
          dev_build=no debug_symbols=no -j2

      - name: Build Android release library
        run: >-
          scons platform=android arch=${{ matrix.arch }} target=template_release
          dev_build=no debug_symbols=no -j2

      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: fairygui-android-${{ matrix.arch }}
          path: examples/addons/fairygui/bin/
          if-no-files-found: error

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11
          no-cache: true

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.4.0

      - name: Build Web libraries with threads
        run: |
          scons platform=web arch=wasm32 target=template_debug threads=yes dev_build=no debug_symbols=no -j2
          scons platform=web arch=wasm32 target=template_release threads=yes dev_build=no debug_symbols=no -j2

      - name: Build Web libraries without threads
        run: |
          scons platform=web arch=wasm32 target=template_debug threads=no dev_build=no debug_symbols=no -j2
          scons platform=web arch=wasm32 target=template_release threads=no dev_build=no debug_symbols=no -j2

      - name: Upload Web libraries
        uses: actions/upload-artifact@v4
        with:
          name: fairygui-web-wasm32
          path: examples/addons/fairygui/bin/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.4.0

      - name: Build iOS XCFrameworks
        shell: bash
        run: |
          bash tools/generate_ios_xcframework.sh template_debug
          bash tools/generate_ios_xcframework.sh template_release

      - name: Upload iOS libraries
        uses: actions/upload-artifact@v4
        with:
          name: fairygui-ios-arm64
          path: examples/addons/fairygui/bin/
          if-no-files-found: error

  package:
    needs: [desktop, android, web, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download all platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: fairygui-*
          path: package/addons/fairygui/bin
          merge-multiple: true

      - name: Add extension descriptor
        run: cp examples/addons/fairygui/fairygui.gdextension package/addons/fairygui/

      - name: Create all-platform plugin archive
        run: |
          mkdir -p dist
          cd package
          zip -r "../dist/fairygui-godot-${{ github.ref_name }}.zip" addons

      - name: Upload combined plugin
        uses: actions/upload-artifact@v4
        with:
          name: fairygui-godot-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*.zip
          --verify-tag --generate-notes
